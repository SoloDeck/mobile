name: solodesk_mobile
description: SoloDesk Mobile — AI-powered CRM for Vietnamese freelancers.
publish_to: 'none'
version: 1.5.0+6

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.3.0

  # Networking
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0

  # Code generation — serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local database
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  # Secure storage
  flutter_secure_storage: ^10.3.1

  # Authentication
  google_sign_in: ^7.0.0

  # UI
  shimmer: ^3.0.0
  intl: ^0.20.3

  # Utilities
  collection: ^1.19.0
  equatable: ^2.1.0
  logger: ^2.5.0
  envied: ^1.3.8

  # Voice / permissions
  speech_to_text: ^7.0.0
  permission_handler: ^12.0.3

  # Payments — mở deeplink/liên kết thanh toán MoMo
  url_launcher: ^6.3.1

  # Media pickers
  image_picker: ^1.1.2
  file_picker: ^12.0.0

  # Deep linking — nhận lại solodesk://payment-result khi MoMo trả quyền về app
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4-dev.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.9.5
  drift_dev: ^2.26.1
  envied_generator: ^1.3.8
  mockito: ^5.4.5
  mocktail: ^1.0.4
  # Poll loop test (subscriptions/poll_payment_intent_usecase) drives
  # Future.delayed backoff without waiting in real time.
  fake_async: ^1.3.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
