name: Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump patch version + build number
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'chore(release)') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version + build number in pubspec.yaml
        id: bump
        run: |
          CURRENT=$(grep -m1 '^version: ' pubspec.yaml | sed -E 's/version: //')
          VERSION_PART="${CURRENT%%+*}"
          BUILD_PART="${CURRENT##*+}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_PART"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          NEW_BUILD=$((BUILD_PART + 1))
          NEW="$NEW_VERSION+$NEW_BUILD"
          sed -i "s/^version: $CURRENT/version: $NEW/" pubspec.yaml
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_full=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): bump version to v${{ steps.bump.outputs.new_full }} [skip ci]"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Notify SoloDesk superproject to sync submodule pointer
        if: ${{ secrets.SUPERREPO_DISPATCH_TOKEN != '' }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPERREPO_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/SoloDeck/SoloDesk/dispatches \
            -d "{\"event_type\":\"submodule-updated\",\"client_payload\":{\"submodule\":\"mobile\",\"sha\":\"$(git rev-parse HEAD)\",\"version\":\"${{ steps.bump.outputs.new_full }}\"}}"
